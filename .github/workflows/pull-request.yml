name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request replaces a build still running.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
